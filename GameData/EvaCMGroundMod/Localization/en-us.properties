# Mod-specific keys. Compiled to Localization/en-us.cfg at build time, prefixed
# with #LOC_EvaCMGroundMod_. Common keys (OK/Cancel, log levels...) live in KSP-Shared.

# Settings window (application launcher)
windowTitle = EVA Ground Fix
settingsLogLevel = Log level
settingsGroundOffset = Ground offset
settingsGroundOffsetValue = <<1>> m
settingsGroundOffsetHint = How close to the ground a part may come before the placement is refused. Raise it if parts still end up buried, lower it if they refuse to sit on the surface.
settingsKeepAnchoredBase = Keep anchored bases in place
settingsKeepAnchoredBaseHint = Stops KSP from putting a base built on a ground anchor back down on the terrain at every load, which pulls the anchor out of the ground a little more each time. Only affects bases that carry a deployed anchor, and takes effect at the next load.
