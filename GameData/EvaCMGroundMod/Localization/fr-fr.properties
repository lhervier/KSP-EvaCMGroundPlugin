# Clés propres au mod. Compilées dans Localization/fr-fr.cfg au build, préfixées
# par #LOC_EvaCMGroundMod_. Les clés communes (OK/Annuler, niveaux de log) sont dans KSP-Shared.

# Fenêtre de réglages (barre d'applications)
windowTitle = Correctif sol EVA
settingsLogLevel = Niveau de log
settingsGroundOffset = Marge au sol
settingsGroundOffsetValue = <<1>> m
settingsGroundOffsetHint = Hauteur à laquelle une pièce est arrêtée au-dessus du contact avec le sol. À augmenter si des pièces finissent encore enterrées, à laisser à 0 pour qu'elles se posent au contact franc.
settingsKeepAnchoredBase = Garder les bases ancrées en place
settingsKeepAnchoredBaseHint = Empêche KSP de reposer sur le terrain, à chaque chargement, une base bâtie sur un point d'ancrage — ce qui sort l'ancre de terre un peu plus chaque fois. N'agit que sur les bases portant une ancre déployée, et prend effet au prochain chargement.
